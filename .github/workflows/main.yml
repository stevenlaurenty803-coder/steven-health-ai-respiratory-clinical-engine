name: Build Steven Health AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "steven-health-ai",
            "version": "1.0.0",
            "private": true,
            "type": "module",
            "scripts": {
              "build": "vite build"
            },
            "dependencies": {
              "@capacitor/android": "^7.4.0",
              "@capacitor/cli": "^7.4.0",
              "@capacitor/core": "^7.4.0",
              "@vitejs/plugin-react": "^4.6.0",
              "react": "^19.1.0",
              "react-dom": "^19.1.0",
              "vite": "^7.1.0"
            },
            "devDependencies": {}
          }
          EOF

      - name: Create index.html
        run: |
          mkdir -p src

          cat > index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <meta name="theme-color" content="#0b132b">
            <title>Steven Health AI</title>
          </head>
          <body>
            <div id="root"></div>
            <script type="module" src="/src/main.jsx"></script>
          </body>
          </html>
          EOF

      - name: Create React app
        run: |
          cat > src/main.jsx <<'EOF'
          import React, { useState } from "react";
          import { createRoot } from "react-dom/client";

          function App() {
            const [input, setInput] = useState("");
            const [messages, setMessages] = useState([
              {
                role: "assistant",
                text: "Welcome to Steven Health AI. Ask me a health education question."
              }
            ]);

            function sendMessage() {
              if (!input.trim()) return;

              const question = input.trim();

              setMessages(prev => [
                ...prev,
                { role: "user", text: question },
                {
                  role: "assistant",
                  text: "Steven Health AI is ready. The secure AI backend will be connected next."
                }
              ]);

              setInput("");
            }

            return (
              <div style={{
                minHeight: "100vh",
                background: "#f4f7fb",
                fontFamily: "Arial",
                display: "flex",
                flexDirection: "column"
              }}>

                <header style={{
                  background: "#0b132b",
                  color: "white",
                  padding: "20px"
                }}>
                  <h1 style={{margin: 0}}>Steven Health AI</h1>
                  <p>Health Education AI for Africa</p>
                </header>

                <main style={{
                  width: "100%",
                  maxWidth: "900px",
                  margin: "auto",
                  padding: "20px",
                  flex: 1
                }}>

                  <div style={{
                    background: "white",
                    padding: "20px",
                    borderRadius: "15px",
                    marginBottom: "20px"
                  }}>
                    <h2>AI Health Assistant</h2>
                    <p>
                      English + Kiswahili support
                    </p>
                  </div>

                  <div style={{
                    background: "white",
                    padding: "20px",
                    borderRadius: "15px"
                  }}>

                    <div style={{
                      minHeight: "350px",
                      overflowY: "auto"
                    }}>

                      {messages.map((msg, index) => (
                        <div
                          key={index}
                          style={{
                            padding: "12px",
                            marginBottom: "10px",
                            borderRadius: "10px",
                            background:
                              msg.role === "user"
                                ? "#dce9ff"
                                : "#eef1f5"
                          }}
                        >
                          <strong>
                            {msg.role === "user"
                              ? "You"
                              : "Steven Health AI"}
                          </strong>

                          <p>{msg.text}</p>
                        </div>
                      ))}

                    </div>

                    <div style={{
                      display: "flex",
                      gap: "10px"
                    }}>

                      <textarea
                        value={input}
                        onChange={e => setInput(e.target.value)}
                        placeholder="Ask Steven Health AI..."
                        style={{
                          flex: 1,
                          minHeight: "60px",
                          padding: "12px",
                          borderRadius: "10px",
                          border: "1px solid #ccc"
                        }}
                      />

                      <button
                        onClick={sendMessage}
                        style={{
                          padding: "0 20px",
                          border: "none",
                          borderRadius: "10px",
                          background: "#0b132b",
                          color: "white",
                          fontWeight: "bold"
                        }}
                      >
                        Send
                      </button>

                    </div>

                  </div>

                </main>

                <footer style={{
                  textAlign: "center",
                  padding: "15px"
                }}>
                  Steven Health AI © 2026
                </footer>

              </div>
            );
          }

          createRoot(document.getElementById("root")).render(
            <App />
          );
          EOF

      - name: Create Vite config
        run: |
          cat > vite.config.js <<'EOF'
          import { defineConfig } from "vite";
          import react from "@vitejs/plugin-react";

          export default defineConfig({
            plugins: [react()]
          });
          EOF

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from "@capacitor/cli";

          const config: CapacitorConfig = {
            appId: "com.stevenhealthai.app",
            appName: "Steven Health AI",
            webDir: "dist"
          };

          export default config;
          EOF

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Steven-Health-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

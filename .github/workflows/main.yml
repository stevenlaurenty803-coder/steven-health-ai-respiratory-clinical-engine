name: Build Steven Health AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "steven-health-ai",
            "version": "1.0.0",
            "private": true,
            "type": "module",
            "scripts": {
              "dev": "vite",
              "build": "vite build"
            },
            "dependencies": {
              "@capacitor/android": "^7.4.0",
              "@capacitor/cli": "^7.4.0",
              "@capacitor/core": "^7.4.0",
              "@vitejs/plugin-react": "^4.6.0",
              "react": "^19.1.0",
              "react-dom": "^19.1.0",
              "vite": "^7.1.0"
            }
          }
          EOF

      - name: Create index.html
        run: |
          mkdir -p src

          cat > index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta
              name="viewport"
              content="width=device-width, initial-scale=1.0"
            />
            <meta name="theme-color" content="#0b132b" />
            <title>Steven Health AI</title>
          </head>

          <body>
            <div id="root"></div>
            <script type="module" src="/src/main.jsx"></script>
          </body>
          </html>
          EOF

      - name: Create main.jsx
        run: |
          cat > src/main.jsx <<'EOF'
          import React from "react";
          import ReactDOM from "react-dom/client";
          import App from "./App.jsx";

          ReactDOM.createRoot(document.getElementById("root")).render(
            <React.StrictMode>
              <App />
            </React.StrictMode>
          );
          EOF

      - name: Create App.jsx
        run: |
          cat > src/App.jsx <<'EOF'
          import React, { useState } from "react";

          export default function App() {
            const [message, setMessage] = useState("");
            const [messages, setMessages] = useState([
              {
                role: "assistant",
                text: "Hello! I am Steven Health AI. How can I help you today?"
              }
            ]);

            function sendMessage() {
              const text = message.trim();

              if (!text) return;

              setMessages((old) => [
                ...old,
                {
                  role: "user",
                  text
                },
                {
                  role: "assistant",
                  text:
                    "Steven Health AI is ready. Connect the secure AI backend to enable live medical AI responses."
                }
              ]);

              setMessage("");
            }

            return (
              <div className="app">

                <header className="header">
                  <div>
                    <h1>Steven Health AI</h1>
                    <p>Health Education AI for Africa</p>
                  </div>

                  <div className="status">
                    ● AI READY
                  </div>
                </header>

                <main className="main">

                  <section className="welcome">
                    <h2>Welcome to Steven Health AI</h2>

                    <p>
                      Your intelligent health education assistant supporting
                      English and Kiswahili.
                    </p>

                    <div className="modes">

                      <button>Clinical Officer Tutor</button>

                      <button>OSCE Examiner</button>

                      <button>Emergency Medicine</button>

                      <button>Pediatrics</button>

                      <button>OBGYN</button>

                      <button>Pharmacology</button>

                    </div>
                  </section>

                  <section className="chat">

                    <div className="messages">

                      {messages.map((item, index) => (
                        <div
                          key={index}
                          className={
                            item.role === "user"
                              ? "message user"
                              : "message assistant"
                          }
                        >
                          <strong>
                            {item.role === "user"
                              ? "You"
                              : "Steven Health AI"}
                          </strong>

                          <p>{item.text}</p>
                        </div>
                      ))}

                    </div>

                    <div className="inputArea">

                      <textarea
                        value={message}
                        onChange={(e) => setMessage(e.target.value)}
                        placeholder="Ask Steven Health AI..."
                        onKeyDown={(e) => {
                          if (e.key === "Enter" && !e.shiftKey) {
                            e.preventDefault();
                            sendMessage();
                          }
                        }}
                      />

                      <button onClick={sendMessage}>
                        Send
                      </button>

                    </div>

                  </section>

                </main>

                <footer>
                  Steven Health AI © 2026
                </footer>

                <style>{`

                  * {
                    box-sizing: border-box;
                  }

                  body {
                    margin: 0;
                    font-family: Arial, sans-serif;
                    background: #f4f7fb;
                    color: #172033;
                  }

                  .app {
                    min-height: 100vh;
                    display: flex;
                    flex-direction: column;
                  }

                  .header {
                    background: #0b132b;
                    color: white;
                    padding: 18px 22px;
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                  }

                  .header h1 {
                    margin: 0;
                    font-size: 23px;
                  }

                  .header p {
                    margin: 5px 0 0;
                    opacity: .75;
                  }

                  .status {
                    font-size: 12px;
                    font-weight: bold;
                  }

                  .main {
                    width: 100%;
                    max-width: 1000px;
                    margin: auto;
                    padding: 25px 15px;
                    flex: 1;
                  }

                  .welcome {
                    background: white;
                    padding: 22px;
                    border-radius: 15px;
                    margin-bottom: 20px;
                  }

                  .welcome h2 {
                    margin-top: 0;
                  }

                  .modes {
                    display: grid;
                    grid-template-columns:
                      repeat(auto-fit, minmax(140px, 1fr));
                    gap: 10px;
                    margin-top: 20px;
                  }

                  .modes button {
                    padding: 13px;
                    border: 0;
                    border-radius: 10px;
                    background: #e8eef8;
                    cursor: pointer;
                  }

                  .chat {
                    background: white;
                    border-radius: 15px;
                    padding: 15px;
                  }

                  .messages {
                    min-height: 350px;
                    max-height: 500px;
                    overflow-y: auto;
                  }

                  .message {
                    padding: 13px;
                    margin-bottom: 12px;
                    border-radius: 12px;
                    max-width: 85%;
                  }

                  .message p {
                    margin-bottom: 0;
                    line-height: 1.5;
                  }

                  .assistant {
                    background: #eef3f9;
                  }

                  .user {
                    margin-left: auto;
                    background: #dce9ff;
                  }

                  .inputArea {
                    display: flex;
                    gap: 10px;
                    margin-top: 15px;
                  }

                  textarea {
                    flex: 1;
                    min-height: 55px;
                    resize: none;
                    padding: 13px;
                    border: 1px solid #ccd5e2;
                    border-radius: 10px;
                    font-size: 15px;
                  }

                  .inputArea button {
                    border: 0;
                    border-radius: 10px;
                    padding: 0 22px;
                    background: #0b132b;
                    color: white;
                    font-weight: bold;
                    cursor: pointer;
                  }

                  footer {
                    text-align: center;
                    padding: 18px;
                    font-size: 12px;
                    opacity: .6;
                  }

                  @media (max-width: 600px) {

                    .header {
                      align-items: flex-start;
                      gap: 10px;
                      flex-direction: column;
                    }

                    .inputArea {
                      flex-direction: column;
                    }

                    .inputArea button {
                      height: 48px;
                    }

                  }

                `}</style>

              </div>
            );
          }
          EOF

      - name: Create Vite config
        run: |
          cat > vite.config.js <<'EOF'
          import { defineConfig } from "vite";
          import react from "@vitejs/plugin-react";

          export default defineConfig({
            plugins: [react()],
            build: {
              outDir: "dist"
            }
          });
          EOF

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from "@capacitor/cli";

          const config: CapacitorConfig = {
            appId: "com.stevenhealthai.app",
            appName: "Steven Health AI",
            webDir: "dist",
            bundledWebRuntime: false
          };

          export default config;
          EOF

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: steven-health-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
